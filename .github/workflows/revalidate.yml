name: Revalidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run public-release:scan
      - run: bun run typecheck
      - run: bun run build
      - run: bun run scripts/validate-skill.ts
      - run: bun run scripts/validate-anti-pattern.ts
      - run: bun run scripts/validate-domain-artifacts.ts
      - run: bun run scripts/validate-proposals.ts
      - run: bun run scripts/validate-trace.ts
      - run: bun run scripts/validate-run.ts
      - run: bun run scripts/rebuild-contributors.ts
      - run: bun run scripts/compute-stats.ts
      - run: git diff --exit-code contributors STATS.md
      - run: bun test scripts
