name: Archive Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/archive-regression.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun test scripts
      - name: Open archive pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No regression archives to propose."
            exit 0
          fi
          branch="automation/archive-regressions-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add domains retired
          git commit -m "chore: archive regression candidates"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Archive regression candidates" \
            --body "Automated archive proposal from archive-regression workflow." \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch"
