name: Validate Anti-Pattern

on:
  pull_request:
    paths:
      - "domains/**/anti-patterns/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/validate-anti-pattern.ts
