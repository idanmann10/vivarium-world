name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun test scripts
      - run: bun run scripts/compute-signals.ts
      - run: bun run scripts/compute-trust.ts
      - run: bun run scripts/list-held-reviews.ts
      - run: bun run scripts/check-telemetry.ts
      - run: bun run scripts/check-veto-window.ts
        env:
          WORLD_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          WORLD_PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
      - run: bun run scripts/enforce-auto-merge.ts
      - name: Enable pull request auto-merge
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --auto
