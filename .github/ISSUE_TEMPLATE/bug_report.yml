name: Bug report
description: Report validation, workflow, or artifact behavior that is broken or unsafe
title: "[bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: affected-world-area
    attributes:
      label: Affected world area
      options:
        - skills
        - anti-patterns
        - traces
        - runs
        - proposals
        - validation scripts
        - auto-merge gates
        - stats or contributor profiles
        - docs
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction
      description: Include exact paths, commands, PRs, or workflow runs.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: PII or credential risk
      description: Note whether the report involves PII, credentials, private paths, or internal-world material.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should validation, review, or artifact retrieval have done?
    validations:
      required: false
